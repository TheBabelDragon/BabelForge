[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-contracts",
    "crates/forge-registry",
    "crates/forge-state",
    "crates/forge-policy",
    "crates/forge-executor",
    "crates/forge-events",
    "crates/forge-replay",
    "crates/forge-crypto",
    "crates/forge-transport",
    "crates/forge-node",
    "crates/forge-wasm",
    "crates/forge-cli",
]
default-members = ["crates/forge-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TheBabelDragon"]
repository = "https://github.com/TheBabelDragon/BabelForge"
description = "BabelForge — Universal Execution Runtime for the TheBabelDragon ecosystem"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
thiserror = "1.0.61"
anyhow = "1.0.86"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", default-features = false, features = ["serde", "clock", "std"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8.5"
sha2 = "0.10.8"
hex = "0.4.3"
clap = { version = "=4.4.18", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
tempfile = "3.10.1"
once_cell = "1.19.0"

forge-core = { path = "crates/forge-core" }
forge-contracts = { path = "crates/forge-contracts" }
forge-registry = { path = "crates/forge-registry" }
forge-state = { path = "crates/forge-state" }
forge-policy = { path = "crates/forge-policy" }
forge-executor = { path = "crates/forge-executor" }
forge-events = { path = "crates/forge-events" }
forge-replay = { path = "crates/forge-replay" }
forge-crypto = { path = "crates/forge-crypto" }
forge-transport = { path = "crates/forge-transport" }
forge-node = { path = "crates/forge-node" }
forge-wasm = { path = "crates/forge-wasm" }
